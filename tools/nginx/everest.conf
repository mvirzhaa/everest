# ==============================================================================
# Nginx Configuration untuk Everest pada domain sc.uika-bogor.ac.id/everest
# Letakkan konfigurasi ini di dalam blok server SSL sc.uika-bogor.ac.id:
# server {
#     server_name sc.uika-bogor.ac.id;
#     ...
# }
# ==============================================================================

# Redirect /everest (tanpa slash) ke /everest/ agar relative path berfungsi
location = /everest {
    return 301 /everest/;
}

# Proxy seluruh endpoint backend Everest (API, WebSocket, Dashboard, Media)
location /everest/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;

    # Dukungan WebSocket untuk Socket.IO (peta live, panic satpam real-time)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Forwarding header standar
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /everest;

    # Ukuran maksimum unggahan (foto laporan hingga 20 MB)
    client_max_body_size 20m;

    # Timeout untuk koneksi WebSocket jangka panjang
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
